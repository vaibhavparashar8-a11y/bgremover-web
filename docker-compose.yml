# One-command stack: docker compose up
# NOTE (E:-drive policy): Docker Desktop stores images/volumes at a location set
# in Docker Desktop Settings > Resources — verify it points at E: before using
# Docker on this machine. Docker is currently not installed here; the plain
# local run (start-all.cmd) is the tested path.
services:
  inference:
    build: ./inference
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ai-models:/models
    environment:
      U2NET_HOME: /models/u2net
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      BGR_INFERENCE_URL: http://inference:8000
      BGR_TMP_DIR: /tmp/bgremover
    depends_on:
      inference:
        condition: service_healthy

volumes:
  ai-models:
